<div class="view-section py-6">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-col md:flex-row justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Kiracı Yönetimi</h1>
                <p class="text-gray-500 dark:text-gray-400">Sistemdeki kurum ve organizasyonlar</p>
            </div>
            <button onclick="showModal('tenant-modal'); document.getElementById('tenant-form').reset(); document.getElementById('tenant-id').value='';" class="mt-4 md:mt-0 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition-colors">
                <i class="fas fa-building"></i> Yeni Kiracı
            </button>
        </div>

        <!-- Tenant List -->
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/50 flex justify-between items-center">
                <h3 class="font-semibold text-gray-900 dark:text-white">Kayıtlı Kiracılar</h3>
                <input type="text" id="tenant-search" placeholder="Kiracı ara..." class="px-3 py-1 text-sm border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white">
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
                    <thead class="bg-white dark:bg-gray-800">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Kiracı Adı</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Domain</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Durum</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Oluşturulma</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">İşlemler</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700" id="tenants-table">
                        <tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">Yükleniyor...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Tenant Modal -->
<div id="tenant-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
    <div class="relative top-10 mx-auto p-5 border w-96 md:w-[600px] shadow-lg rounded-md bg-white dark:bg-gray-800 max-h-[90vh] overflow-y-auto">
        <div class="mt-3">
            <h3 class="text-lg leading-6 font-medium text-gray-900 dark:text-white mb-4">Kiracı Bilgileri</h3>
            <form id="tenant-form">
                <input type="hidden" id="tenant-id">
                
                <div class="mb-6">
                    <h4 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-3">Genel Bilgiler</h4>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="col-span-2">
                            <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">Kurum Adı</label>
                            <input type="text" id="tenant-name" class="shadow border rounded w-full py-2 px-3 dark:bg-gray-700 dark:border-gray-600 dark:text-white" required>
                        </div>
                        <div>
                            <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">Domain</label>
                            <input type="text" id="tenant-domain" class="shadow border rounded w-full py-2 px-3 dark:bg-gray-700 dark:border-gray-600 dark:text-white" required placeholder="ornek.com">
                        </div>
                        <div>
                            <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">Durum</label>
                            <select id="tenant-status" class="shadow border rounded w-full py-2 px-3 dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                                <option value="active">Aktif</option>
                                <option value="inactive">Pasif</option>
                                <option value="suspended">Askıya Alındı</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="mb-6">
                    <h4 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-3">Yönetici Hesabı</h4>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">Admin Email</label>
                            <input type="email" id="tenant-admin-email" class="shadow border rounded w-full py-2 px-3 dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                        </div>
                        <div>
                            <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">Şifre</label>
                            <input type="password" id="tenant-admin-password" class="shadow border rounded w-full py-2 px-3 dark:bg-gray-700 dark:border-gray-600 dark:text-white" placeholder="Sadece oluştururken girin">
                        </div>
                    </div>
                </div>

                <div class="mb-6">
                    <h4 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-3">Aktif Modüller</h4>
                    <div class="grid grid-cols-2 gap-2" id="module-toggles">
                        <label class="flex items-center space-x-2">
                            <input type="checkbox" name="modules" value="hr" class="rounded text-indigo-600">
                            <span class="text-gray-700 dark:text-gray-300">İnsan Kaynakları</span>
                        </label>
                        <label class="flex items-center space-x-2">
                            <input type="checkbox" name="modules" value="crm" class="rounded text-indigo-600">
                            <span class="text-gray-700 dark:text-gray-300">CRM</span>
                        </label>
                        <label class="flex items-center space-x-2">
                            <input type="checkbox" name="modules" value="accounting" class="rounded text-indigo-600">
                            <span class="text-gray-700 dark:text-gray-300">Ön Muhasebe</span>
                        </label>
                        <label class="flex items-center space-x-2">
                            <input type="checkbox" name="modules" value="inventory" class="rounded text-indigo-600">
                            <span class="text-gray-700 dark:text-gray-300">Stok Takibi</span>
                        </label>
                        <label class="flex items-center space-x-2">
                            <input type="checkbox" name="modules" value="politics" class="rounded text-indigo-600">
                            <span class="text-gray-700 dark:text-gray-300">Siyasi Parti</span>
                        </label>
                        <label class="flex items-center space-x-2">
                            <input type="checkbox" name="modules" value="donation" class="rounded text-indigo-600">
                            <span class="text-gray-700 dark:text-gray-300">Bağış Yönetimi</span>
                        </label>
                        <label class="flex items-center space-x-2">
                            <input type="checkbox" name="modules" value="field" class="rounded text-indigo-600">
                            <span class="text-gray-700 dark:text-gray-300">Saha Yönetimi</span>
                        </label>
                        <label class="flex items-center space-x-2">
                            <input type="checkbox" name="modules" value="helpdesk" class="rounded text-indigo-600">
                            <span class="text-gray-700 dark:text-gray-300">Destek Masası</span>
                        </label>
                    </div>
                </div>

                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" onclick="closeModal('tenant-modal')" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300">İptal</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700">Kaydet</button>
                </div>
            </form>
        </div>
    </div>
</div>
