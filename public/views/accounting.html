<div class="view-section py-6">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-col md:flex-row justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Ön Muhasebe</h1>
                <p class="text-gray-500 dark:text-gray-400">Gelir, gider ve bakiye yönetimi</p>
            </div>
            <div class="flex gap-2 mt-4 md:mt-0">
                <button onclick="showModal('transaction-modal'); document.getElementById('trx-type').value='income';" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition-colors">
                    <i class="fas fa-plus"></i> Gelir Ekle
                </button>
                <button onclick="showModal('transaction-modal'); document.getElementById('trx-type').value='expense';" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition-colors">
                    <i class="fas fa-minus"></i> Gider Ekle
                </button>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white dark:bg-gray-800 p-6 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-gray-500 dark:text-gray-400 text-sm font-medium">Toplam Gelir</h3>
                    <div class="p-2 bg-green-100 dark:bg-green-900/50 text-green-600 rounded-lg">
                        <i class="fas fa-arrow-up"></i>
                    </div>
                </div>
                <div class="text-2xl font-bold text-gray-900 dark:text-white" id="stat-total-income">0.00 ₺</div>
            </div>
            <div class="bg-white dark:bg-gray-800 p-6 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-gray-500 dark:text-gray-400 text-sm font-medium">Toplam Gider</h3>
                    <div class="p-2 bg-red-100 dark:bg-red-900/50 text-red-600 rounded-lg">
                        <i class="fas fa-arrow-down"></i>
                    </div>
                </div>
                <div class="text-2xl font-bold text-gray-900 dark:text-white" id="stat-total-expense">0.00 ₺</div>
            </div>
            <div class="bg-white dark:bg-gray-800 p-6 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-gray-500 dark:text-gray-400 text-sm font-medium">Net Bakiye</h3>
                    <div class="p-2 bg-blue-100 dark:bg-blue-900/50 text-blue-600 rounded-lg">
                        <i class="fas fa-wallet"></i>
                    </div>
                </div>
                <div class="text-2xl font-bold text-gray-900 dark:text-white" id="stat-net-balance">0.00 ₺</div>
            </div>
        </div>

        <!-- Transactions Table -->
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-800/50">
                <h3 class="font-semibold text-gray-900 dark:text-white">Son İşlemler</h3>
                <div class="flex gap-2">
                    <select id="filter-type" class="text-sm border-gray-300 rounded-md dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                        <option value="">Tüm İşlemler</option>
                        <option value="income">Gelirler</option>
                        <option value="expense">Giderler</option>
                    </select>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
                    <thead class="bg-gray-50 dark:bg-gray-700">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Tarih</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Açıklama</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Kategori</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Tür</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Tutar</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">İşlem</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700" id="transactions-table">
                        <tr><td colspan="6" class="px-6 py-4 text-center text-gray-500">Yükleniyor...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Transaction Modal -->
<div id="transaction-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
    <div class="relative top-20 mx-auto p-5 border w-96 md:w-[500px] shadow-lg rounded-md bg-white dark:bg-gray-800">
        <div class="mt-3">
            <h3 class="text-lg leading-6 font-medium text-gray-900 dark:text-white mb-4">Yeni İşlem</h3>
            <form id="transaction-form">
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">İşlem Türü</label>
                        <select id="trx-type" class="shadow border rounded w-full py-2 px-3 dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                            <option value="income">Gelir</option>
                            <option value="expense">Gider</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">Tarih</label>
                        <input type="date" id="trx-date" class="shadow border rounded w-full py-2 px-3 dark:bg-gray-700 dark:border-gray-600 dark:text-white" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">Tutar (₺)</label>
                    <input type="number" step="0.01" id="trx-amount" class="shadow border rounded w-full py-2 px-3 dark:bg-gray-700 dark:border-gray-600 dark:text-white" required>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">Kategori</label>
                    <input type="text" id="trx-category" class="shadow border rounded w-full py-2 px-3 dark:bg-gray-700 dark:border-gray-600 dark:text-white" list="category-list" placeholder="Örn: Satış, Kira, Maaş">
                    <datalist id="category-list">
                        <option value="Satış Geliri">
                        <option value="Hizmet Geliri">
                        <option value="Bağış">
                        <option value="Personel Gideri">
                        <option value="Kira/Ofis">
                        <option value="Vergi/SGK">
                    </datalist>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">Açıklama</label>
                    <textarea id="trx-description" rows="2" class="shadow border rounded w-full py-2 px-3 dark:bg-gray-700 dark:border-gray-600 dark:text-white"></textarea>
                </div>
                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" onclick="closeModal('transaction-modal')" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300">İptal</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700">Kaydet</button>
                </div>
            </form>
        </div>
    </div>
</div>
