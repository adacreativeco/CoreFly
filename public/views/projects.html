<div id="view-projects" class="view-section">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Proje Yönetimi</h1>
            <div class="flex space-x-2">
                <button onclick="showModal('project-create-modal')" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 transition-colors">
                    <i class="fas fa-plus mr-2"></i> Yeni Proje
                </button>
            </div>
        </div>

        <!-- Stats Overview -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6" id="projects-stats-container">
            <!-- Stats injected by JS -->
        </div>

        <!-- Filters -->
        <div class="bg-white dark:bg-gray-800 shadow rounded-lg mb-6">
            <div class="p-4 flex gap-4">
                <select id="project-filter-status" onchange="filterProjects()" class="rounded-md border-gray-300 dark:border-gray-600 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 dark:bg-gray-700 dark:text-white sm:text-sm p-2 border">
                    <option value="all">Tüm Durumlar</option>
                    <option value="planning">Planlama</option>
                    <option value="active">Aktif</option>
                    <option value="on_hold">Beklemede</option>
                    <option value="completed">Tamamlandı</option>
                    <option value="cancelled">İptal</option>
                </select>
                <select id="project-filter-priority" onchange="filterProjects()" class="rounded-md border-gray-300 dark:border-gray-600 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 dark:bg-gray-700 dark:text-white sm:text-sm p-2 border">
                    <option value="all">Tüm Öncelikler</option>
                    <option value="high">Yüksek</option>
                    <option value="medium">Orta</option>
                    <option value="low">Düşük</option>
                </select>
                <input type="text" id="project-search" oninput="filterProjects()" placeholder="Proje ara..." class="flex-1 rounded-md border-gray-300 dark:border-gray-600 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 dark:bg-gray-700 dark:text-white sm:text-sm p-2 border">
            </div>
        </div>

        <!-- Projects List -->
        <div class="bg-white dark:bg-gray-800 shadow overflow-hidden sm:rounded-md">
            <ul role="list" class="divide-y divide-gray-200 dark:divide-gray-700" id="projects-list-container">
                <li class="px-4 py-8 text-center text-gray-500 dark:text-gray-400">Yükleniyor...</li>
            </ul>
        </div>
    </div>
</div>
