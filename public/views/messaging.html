<div id="view-messaging" class="view-section h-[calc(100vh-64px)] overflow-hidden flex flex-col">
    <div class="flex-1 flex overflow-hidden">
        <!-- Sidebar: Conversations -->
        <div class="w-full md:w-80 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col z-10" id="messaging-sidebar">
            <!-- Header -->
            <div class="p-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
                <h2 class="text-lg font-semibold text-gray-900 dark:text-white">Mesajlar</h2>
                <div class="flex space-x-2">
                    <button onclick="openNewChatModal()" class="text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 dark:hover:text-indigo-300" title="Yeni Sohbet">
                        <i class="fas fa-user-plus"></i>
                    </button>
                    <button onclick="showModal('messaging-new-group-modal')" class="text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 dark:hover:text-indigo-300" title="Yeni Grup">
                        <i class="fas fa-edit"></i>
                    </button>
                </div>
            </div>
            
            <!-- Search -->
            <div class="p-4 border-b border-gray-200 dark:border-gray-700">
                <div class="relative">
                    <input type="text" oninput="filterConversations(event)" placeholder="Ara..." class="w-full pl-10 pr-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:text-white text-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-search text-gray-400"></i>
                    </div>
                </div>
            </div>

            <!-- List -->
            <div class="flex-1 overflow-y-auto" id="messaging-conversations-list">
                <!-- Dynamic Content -->
                <div class="p-4 text-center text-gray-500 dark:text-gray-400 text-sm">Sohbetler yükleniyor...</div>
            </div>
        </div>

        <!-- Main Area: Chat Window -->
        <div class="flex-1 flex flex-col bg-gray-50 dark:bg-gray-900 hidden md:flex" id="messaging-chat-area">
            <!-- Chat Header -->
            <div class="h-16 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between px-6 flex-shrink-0">
                <div class="flex items-center">
                    <button class="md:hidden mr-4 text-gray-500" onclick="toggleMessagingSidebar()">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <div class="relative">
                        <img src="/images/default-avatar.svg" class="w-10 h-10 rounded-full bg-gray-200" id="chat-header-avatar">
                        <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white dark:border-gray-800 rounded-full"></span>
                    </div>
                    <div class="ml-4">
                        <h3 class="text-sm font-medium text-gray-900 dark:text-white" id="chat-header-name">Sohbet Seçin</h3>
                        <p class="text-xs text-gray-500 dark:text-gray-400" id="chat-header-status"></p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <button onclick="startVoiceCall()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300"><i class="fas fa-phone"></i></button>
                    <button onclick="startVideoCall()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300"><i class="fas fa-video"></i></button>
                    <button onclick="toggleChatInfo()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300"><i class="fas fa-info-circle"></i></button>
                </div>
            </div>

            <!-- Messages -->
            <div class="flex-1 overflow-y-auto p-6 space-y-4" id="messaging-messages-container">
                <!-- Placeholder -->
                <div class="h-full flex flex-col items-center justify-center text-gray-400">
                    <i class="fas fa-comments text-6xl mb-4 text-gray-300 dark:text-gray-700"></i>
                    <p>Mesajlaşmaya başlamak için soldan bir sohbet seçin.</p>
                </div>
            </div>

            <!-- Input Area -->
            <div class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 p-4 flex-shrink-0 hidden" id="messaging-input-area">
                <form onsubmit="handleSendMessage(event)" class="flex space-x-4">
                    <input type="hidden" id="current-chat-id">
                    <input type="hidden" id="current-chat-type"> <!-- 'user' or 'group' -->
                    
                    <button type="button" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300">
                        <i class="fas fa-paperclip"></i>
                    </button>
                    <input type="text" name="message" id="message-input" placeholder="Bir mesaj yazın..." autocomplete="off" class="flex-1 border-gray-300 dark:border-gray-600 rounded-full shadow-sm focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:text-white px-4 py-2">
                    <button type="submit" class="bg-indigo-600 text-white rounded-full w-10 h-10 flex items-center justify-center hover:bg-indigo-700 shadow-sm transition-colors">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
