<div class="view-section py-6">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-col md:flex-row justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Bağış Yönetimi</h1>
                <p class="text-gray-500 dark:text-gray-400">Bağışlar ve bağışçı veritabanı</p>
            </div>
            <button onclick="showModal('donation-modal'); document.getElementById('donation-form').reset(); document.getElementById('donation-id').value='';" class="mt-4 md:mt-0 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition-colors">
                <i class="fas fa-hand-holding-heart"></i> Yeni Bağış
            </button>
        </div>

        <!-- Summary Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white dark:bg-gray-800 p-6 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm">
                <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Bu Ay Toplanan</p>
                <p class="text-2xl font-bold text-gray-900 dark:text-white mt-1" id="stat-monthly-total">0.00 ₺</p>
            </div>
            <div class="bg-white dark:bg-gray-800 p-6 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm">
                <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Yıllık Toplam</p>
                <p class="text-2xl font-bold text-gray-900 dark:text-white mt-1" id="stat-yearly-total">0.00 ₺</p>
            </div>
            <div class="bg-white dark:bg-gray-800 p-6 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm">
                <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Toplam Bağışçı</p>
                <p class="text-2xl font-bold text-gray-900 dark:text-white mt-1" id="stat-donor-count">0</p>
            </div>
            <div class="bg-white dark:bg-gray-800 p-6 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm">
                <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Ortalama Bağış</p>
                <p class="text-2xl font-bold text-gray-900 dark:text-white mt-1" id="stat-avg-donation">0.00 ₺</p>
            </div>
        </div>

        <!-- Donations Table -->
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700 flex flex-col md:flex-row justify-between items-center gap-4 bg-gray-50 dark:bg-gray-800/50">
                <div class="flex-1 w-full md:w-auto">
                    <input type="text" id="donation-search" placeholder="Bağışçı ara..." class="w-full md:w-64 px-4 py-2 text-sm border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                </div>
                <div class="flex gap-2 w-full md:w-auto">
                    <button class="px-3 py-1 text-sm bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md hover:bg-gray-50 dark:hover:bg-gray-600">
                        <i class="fas fa-file-export mr-1"></i> Excel
                    </button>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
                    <thead class="bg-gray-50 dark:bg-gray-700">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Bağışçı</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Tutar</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Tarih</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Ödeme Yöntemi</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Kampanya</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">İşlemler</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700" id="donations-table">
                        <tr><td colspan="6" class="px-6 py-4 text-center text-gray-500">Yükleniyor...</td></tr>
                    </tbody>
                </table>
            </div>
            <!-- Pagination could go here -->
        </div>
    </div>
</div>

<!-- Donation Modal -->
<div id="donation-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
    <div class="relative top-20 mx-auto p-5 border w-96 md:w-[600px] shadow-lg rounded-md bg-white dark:bg-gray-800">
        <div class="mt-3">
            <h3 class="text-lg leading-6 font-medium text-gray-900 dark:text-white mb-4">Bağış Kaydı</h3>
            <form id="donation-form">
                <input type="hidden" id="donation-id">
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div class="col-span-2 md:col-span-1">
                        <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">Ad Soyad</label>
                        <input type="text" id="donor-name" class="shadow border rounded w-full py-2 px-3 dark:bg-gray-700 dark:border-gray-600 dark:text-white" required>
                    </div>
                    <div class="col-span-2 md:col-span-1">
                        <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">Telefon / Email</label>
                        <input type="text" id="donor-contact" class="shadow border rounded w-full py-2 px-3 dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">Tutar (₺)</label>
                        <input type="number" step="0.01" id="donation-amount" class="shadow border rounded w-full py-2 px-3 dark:bg-gray-700 dark:border-gray-600 dark:text-white" required>
                    </div>
                    <div>
                        <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">Tarih</label>
                        <input type="date" id="donation-date" class="shadow border rounded w-full py-2 px-3 dark:bg-gray-700 dark:border-gray-600 dark:text-white" required>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">Ödeme Yöntemi</label>
                        <select id="payment-method" class="shadow border rounded w-full py-2 px-3 dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                            <option value="credit_card">Kredi Kartı</option>
                            <option value="bank_transfer">Havale/EFT</option>
                            <option value="cash">Nakit</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">Kampanya</label>
                        <select id="campaign" class="shadow border rounded w-full py-2 px-3 dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                            <option value="general">Genel Bağış</option>
                            <option value="ramadan">Ramazan Kolisi</option>
                            <option value="education">Eğitim Bursu</option>
                        </select>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">Notlar</label>
                    <textarea id="donation-notes" rows="2" class="shadow border rounded w-full py-2 px-3 dark:bg-gray-700 dark:border-gray-600 dark:text-white"></textarea>
                </div>
                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" onclick="closeModal('donation-modal')" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300">İptal</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700">Kaydet</button>
                </div>
            </form>
        </div>
    </div>
</div>
